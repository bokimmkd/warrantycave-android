name: Android ad task navigation checks

on:
  workflow_dispatch:
  push:
    branches: [fix/ad-task-navigation]

permissions:
  contents: read

concurrency:
  group: ad-task-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Prepare fonts and dependencies
        run: |
          base64 --decode assets/fonts/DejaVuSans.ttf.b64 > assets/fonts/DejaVuSans.ttf
          base64 --decode assets/fonts/DejaVuSans-Bold.ttf.b64 > assets/fonts/DejaVuSans-Bold.ttf
          flutter pub get
      - name: Existing Flutter and backend regression suites
        run: |
          flutter test
          cd functions && npm ci && npm test
      - name: Build diagnostic APKs and run native unit tests
        run: |
          flutter build apk --debug --dart-define=ADMOB_TEST_ADS=true
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ad-task-diagnostic-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            build/app/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 3

  routing:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ad-task-diagnostic-apks
          path: diagnostic
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p evidence
            adb install diagnostic/outputs/flutter-apk/app-debug.apk
            adb install diagnostic/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.warrantycave.app.AdTaskNavigationTest com.warrantycave.app.test/androidx.test.runner.AndroidJUnitRunner > evidence/instrumentation.txt
            cat evidence/instrumentation.txt
            adb pull /sdcard/Android/data/com.warrantycave.app/files/ad-task-evidence evidence/ || true
            adb shell dumpsys activity activities > evidence/activity-stack.txt
            grep -q 'OK (' evidence/instrumentation.txt
            ! grep -E "FAILURES|INSTRUMENTATION_FAILED|Process crashed" evidence/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ad-task-navigation-api-${{ matrix.api }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 3
