name: Android release APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main, feature/warrantycave-next-update, feature/individual-reminders-dark-mode, feature/plan-item-edit-access, feature/admob-release-readiness, feature/compact-ui-polish, feature/play-updates-adaptive-banner, feature/meta-install-compact-account, release/1.0.31-inline-ads, release/1.0.32-rate-app, release/1.0.33-analytics-review, release/1.0.42-production]

permissions:
  contents: write # Allows an unpublished draft delivery if Actions storage is full.

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/release/1.0.42-production' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
      - name: Prepare Unicode PDF fonts
        run: |
          base64 --decode assets/fonts/DejaVuSans.ttf.b64 > assets/fonts/DejaVuSans.ttf
          base64 --decode assets/fonts/DejaVuSans-Bold.ttf.b64 > assets/fonts/DejaVuSans-Bold.ttf
      - name: Verify locale generation
        run: |
          python3 tool/generate_locales.py
          git diff --exit-code -- lib/l10n/additional_translations.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze changed UI
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/domain/category_entry.dart lib/domain/category_catalog.dart lib/l10n/category_translations.dart lib/presentation/screens/categories_screen.dart lib/presentation/screens/add_warranty_screen.dart lib/presentation/screens/item_detail_screen.dart test/categories_test.dart test/categories_ui_test.dart test/warranty_details_ui_test.dart test/guest_accounts_test.dart lib/main.dart lib/data/account_local_store.dart lib/presentation/screens/auth_screen.dart lib/presentation/screens/upgrade_screen.dart test/account_local_store_test.dart test/guest_accounts_test.dart lib/data/firebase_services.dart lib/presentation/app_controller.dart lib/data/usage_analytics.dart lib/data/play_review.dart lib/presentation/release_engagement_host.dart lib/data/play_updates.dart lib/data/ad_service.dart lib/presentation/play_update_widgets.dart lib/presentation/compact_header.dart lib/presentation/widgets.dart lib/presentation/main_shell.dart lib/presentation/screens/home_screen.dart lib/presentation/screens/items_screen.dart lib/presentation/screens/reminders_screen.dart lib/presentation/screens/settings_screen.dart
      - name: Tests
        run: |
          flutter test
          cd functions && npm ci && npm test
      - name: Capture compact UI previews
        run: CAPTURE_UI=true flutter test --update-goldens test/compact_ui_test.dart test/navigation_labels_test.dart test/categories_ui_test.dart test/warranty_details_ui_test.dart
      - name: Build signed PRODUCTION APK and AAB (live ads)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: warrantycave-upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --debug
          cd android && ./gradlew :app:testDebugUnitTest && cd ..
          flutter build apk --release --dart-define=ADMOB_TEST_ADS=false
          flutter build appbundle --release --dart-define=ADMOB_TEST_ADS=false
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          
          live = (b"ca-app-pub-1171723950608276/9463569777", b"ca-app-pub-1171723950608276/9035972595")
          sample = (b"ca-app-pub-3940256099942544/6300978111", b"ca-app-pub-3940256099942544/9214589741")
          results = []
          for path, entry in (
              ("build/app/outputs/flutter-apk/app-release.apk", "lib/arm64-v8a/libapp.so"),
              ("build/app/outputs/bundle/release/app-release.aab", "base/lib/arm64-v8a/libapp.so"),
          ):
              with ZipFile(path) as archive:
                  payload = archive.read(entry)
              counts = {unit.decode(): payload.count(unit) for unit in live + sample}
              assert all(counts[unit.decode()] > 0 for unit in live), counts
              assert all(counts[unit.decode()] == 0 for unit in sample), counts
              results.append({"path": path, "ad_unit_string_counts": counts})
          Path("build/app/outputs/bundle/release/production-ad-verification.json").write_text(json.dumps(results, indent=2) + "\n")
          print("Both release binaries contain live ad units and no Google sample units.")
          PY
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/mapping/release/mapping.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree build/app/outputs/flutter-apk/app-release.apk --file AndroidManifest.xml > build/app/outputs/bundle/release/release-manifest-tree.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/bundle/release/release-resources.txt
          ! grep -Eq "AdNavigationProbeActivity|LegacyAffinityProbeActivity|ExternalDestinationActivity" build/app/outputs/bundle/release/release-manifest-tree.txt
          grep -q "warrantycave_task_affinity" build/app/outputs/bundle/release/release-resources.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab build/app/outputs/mapping/release/mapping.txt > build/app/outputs/bundle/release/checksums.txt
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/signing-certificate.txt
          grep -q "5D:B2:2B:66:1B:0B:1D:40:15:4F:4C:9D:F6:E3:20:8A:DC:B8:D1:99:AB:F0:FC:13:9A:4F:D4:20:65:2D:02:31" build/app/outputs/bundle/release/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: WarrantyCave-1.0.42-build-53-production
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/signing-certificate.txt
            build/app/outputs/bundle/release/checksums.txt
            build/app/outputs/bundle/release/production-ad-verification.json
            build/app/outputs/bundle/release/release-manifest-tree.txt
            build/app/outputs/bundle/release/release-resources.txt
            build/app/outputs/mapping/release/
            test/captures/*.png
            docs/releases/1.0.42-production.md
            pubspec.lock
            build/app/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 3
      - name: Deliver candidate as an unpublished draft if artifact storage is full
        if: steps.artifacts.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -q -r WarrantyCave-1.0.42-53-production.zip build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/signing-certificate.txt build/app/outputs/bundle/release/checksums.txt build/app/outputs/mapping/release build/app/test-results/testDebugUnitTest test/captures docs/releases/1.0.42-production.md pubspec.lock
          gh release create "production-1.0.42-53-${{ github.run_id }}" WarrantyCave-1.0.42-53-production.zip --draft --target "$GITHUB_SHA" --title "WarrantyCave 1.0.42 (53) — unpublished Production candidate" --notes "Owner authorized a fresh Production build with live ads and the accepted ad-navigation fix. This unpublished GitHub draft only retains build artifacts; Google Play submission is performed separately."


