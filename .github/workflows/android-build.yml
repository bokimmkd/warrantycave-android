name: Android release APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main, feature/warrantycave-next-update, feature/individual-reminders-dark-mode, feature/plan-item-edit-access, feature/admob-release-readiness, feature/compact-ui-polish, feature/play-updates-adaptive-banner, feature/meta-install-compact-account, release/1.0.31-inline-ads, release/1.0.32-rate-app, release/1.0.33-analytics-review, feature/guest-profile-1.0.34]

permissions:
  contents: write # Allows an unpublished draft delivery if Actions storage is full.

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/feature/guest-profile-1.0.34' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
      - name: Prepare Unicode PDF fonts
        run: |
          base64 --decode assets/fonts/DejaVuSans.ttf.b64 > assets/fonts/DejaVuSans.ttf
          base64 --decode assets/fonts/DejaVuSans-Bold.ttf.b64 > assets/fonts/DejaVuSans-Bold.ttf
      - name: Dependencies
        run: flutter pub get
      - name: Analyze changed UI
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/data/account_local_store.dart lib/presentation/screens/auth_screen.dart lib/presentation/screens/upgrade_screen.dart test/account_local_store_test.dart test/guest_accounts_test.dart lib/data/firebase_services.dart lib/presentation/app_controller.dart lib/data/usage_analytics.dart lib/data/play_review.dart lib/presentation/release_engagement_host.dart lib/data/play_updates.dart lib/data/ad_service.dart lib/presentation/play_update_widgets.dart lib/presentation/compact_header.dart lib/presentation/widgets.dart lib/presentation/main_shell.dart lib/presentation/screens/home_screen.dart lib/presentation/screens/items_screen.dart lib/presentation/screens/reminders_screen.dart lib/presentation/screens/settings_screen.dart
      - name: Tests
        run: |
          flutter test
          cd functions && npm ci && npm test
      - name: Capture compact UI previews
        run: CAPTURE_UI=true flutter test --update-goldens test/compact_ui_test.dart
      - name: Build final APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: warrantycave-upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --debug
          cd android && ./gradlew :app:testDebugUnitTest && cd ..
          flutter build apk --release --dart-define=ADMOB_TEST_ADS=false
          flutter build appbundle --release --dart-define=ADMOB_TEST_ADS=false
          test -s build/app/outputs/mapping/release/mapping.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab build/app/outputs/mapping/release/mapping.txt > build/app/outputs/bundle/release/checksums.txt
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/signing-certificate.txt
          grep -q "5D:B2:2B:66:1B:0B:1D:40:15:4F:4C:9D:F6:E3:20:8A:DC:B8:D1:99:AB:F0:FC:13:9A:4F:D4:20:65:2D:02:31" build/app/outputs/bundle/release/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: WarrantyCave-1.0.34-build-45-test-candidate
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/signing-certificate.txt
            build/app/outputs/bundle/release/checksums.txt
            build/app/outputs/mapping/release/
            test/captures/*.png
            docs/releases/1.0.34-test-candidate.md
            pubspec.lock
            build/app/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 3
      - name: Deliver candidate as an unpublished draft if artifact storage is full
        if: steps.artifacts.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -q -r WarrantyCave-1.0.34-45-test-candidate.zip build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/signing-certificate.txt build/app/outputs/bundle/release/checksums.txt build/app/outputs/mapping/release build/app/test-results/testDebugUnitTest test/captures docs/releases/1.0.34-test-candidate.md pubspec.lock
          gh release create "test-1.0.34-45-${{ github.run_id }}" WarrantyCave-1.0.34-45-test-candidate.zip --draft --target "$GITHUB_SHA" --title "WarrantyCave 1.0.34 (45) — unpublished test candidate" --notes "Testing only. Do not publish to Google Play until Boki tests and confirms. This unpublished draft is an artifact-delivery fallback; it is not a production release."
