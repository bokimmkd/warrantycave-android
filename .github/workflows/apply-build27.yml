name: Apply WarrantyCave build 27
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'bokimmkd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared build 27 patch
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/build27.patch
          git config user.name "WarrantyCave Build"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/build27.patch
          rm .github/workflows/apply-build27.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:main
