name: WarrantyCave inline ads test build

on:
  workflow_dispatch:
  push:
    branches: [feature/my-items-inline-ads]

concurrency:
  group: inline-ads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message, '[native-only]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Prepare fonts and signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          base64 --decode assets/fonts/DejaVuSans.ttf.b64 > assets/fonts/DejaVuSans.ttf
          base64 --decode assets/fonts/DejaVuSans-Bold.ttf.b64 > assets/fonts/DejaVuSans-Bold.ttf
      - run: flutter pub get
      - name: Analyze ads and Items changes
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/data/ad_service.dart lib/data/inline_banner.dart lib/presentation/items_ad_list.dart lib/presentation/screens/items_screen.dart lib/presentation/main_shell.dart test/items_inline_ads_test.dart
      - name: Flutter regression tests
        run: flutter test --reporter expanded
      - name: Build signed test APK and AAB (sample ads only)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: warrantycave-upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/test-delivery
          cp pubspec.lock build/test-delivery/resolved-pubspec.lock
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/test-delivery/WarrantyCave-1.0.31-41-debug.apk
          cd android && ./gradlew :app:testDebugUnitTest && cd ..
          flutter build apk --release --dart-define=ADMOB_TEST_ADS=true
          cp build/app/outputs/flutter-apk/app-release.apk build/test-delivery/WarrantyCave-1.0.31-41-test.apk
          flutter build appbundle --release --dart-define=ADMOB_TEST_ADS=true
          cp build/app/outputs/bundle/release/app-release.aab build/test-delivery/WarrantyCave-1.0.31-41-test.aab
          keytool -printcert -jarfile build/test-delivery/WarrantyCave-1.0.31-41-test.aab > build/test-delivery/signing-certificate.txt
          grep -q "5D:B2:2B:66:1B:0B:1D:40:15:4F:4C:9D:F6:E3:20:8A:DC:B8:D1:99:AB:F0:FC:13:9A:4F:D4:20:65:2D:02:31" build/test-delivery/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WarrantyCave-1.0.31-build-41-inline-test-ads
          path: build/test-delivery/*
          if-no-files-found: error
          retention-days: 30

  native-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Prepare fonts and dependencies
        run: |
          base64 --decode assets/fonts/DejaVuSans.ttf.b64 > assets/fonts/DejaVuSans.ttf
          base64 --decode assets/fonts/DejaVuSans-Bold.ttf.b64 > assets/fonts/DejaVuSans-Bold.ttf
          flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash -o pipefail -c 'flutter drive -d emulator-5554 --driver=test_driver/ads_driver.dart --target=integration_test/items_ads_test.dart --dart-define=ADMOB_TEST_ADS=true | sed "/^result /d"'
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            bash -o pipefail -c 'flutter drive -d emulator-5554 --driver=test_driver/ads_driver.dart --target=integration_test/items_ads_test.dart --dart-define=ADMOB_TEST_ADS=true --dart-define=ADS_OFFLINE_TEST=true | sed "/^result /d"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WarrantyCave-1.0.31-native-ad-previews
          path: build/native-ad-previews/*.png
          if-no-files-found: warn
