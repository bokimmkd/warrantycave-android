name: iOS simulator and shared checks

on:
  pull_request:
    paths: ['ios/**', 'lib/**', 'pubspec.*', 'test/**', 'integration_test/ios_smoke_test.dart', 'functions/**', 'scripts/*ios*', '.github/workflows/ios-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Check whether native app inputs changed
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          before = event.get('before') if event.get('action') == 'synchronize' else None
          native = True  # Open/reopen/manual runs and unavailable history always build.
          if isinstance(before, str) and re.fullmatch(r'[0-9a-fA-F]{40}', before):
              try:
                  paths = subprocess.check_output(
                      ['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']], text=True).splitlines()
                  native = any(p.startswith(('ios/', 'lib/', 'test/', 'integration_test/', 'pubspec.'))
                      or p in {'.metadata', 'analysis_options.yaml', '.github/workflows/ios-checks.yml'}
                      or (p.startswith('scripts/') and 'ios' in p) for p in paths)
              except subprocess.CalledProcessError:
                  native = True
          print(f'Native app inputs changed: {native}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'native={str(native).lower()}\n')
          PY

  simulator:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    concurrency:
      group: ios-native-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: true
      FLUTTER_SUPPRESS_ANALYTICS: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter config --no-enable-swift-package-manager
      - run: python3 scripts/configure_ios.py --local
      - run: python3 -m unittest discover -s scripts -p 'test_ios_release.py'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test integration_test/ios_smoke_test.dart
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci && npm test && node --check index.js && node --check apple_functions.js
        working-directory: functions
      - name: Boot iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if x["name"].startswith("iPhone")))')
          echo "IOS_SIMULATOR_ID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
      - name: Build and test actual app startup and persistent local warranties on iOS
        run: flutter test integration_test/ios_smoke_test.dart -d "$IOS_SIMULATOR_ID" --dart-define-from-file=.ios-dart-defines.json --reporter expanded
      - name: Collect simulator screenshot
        if: always() && env.IOS_SIMULATOR_ID != ''
        continue-on-error: true
        run: |
          mkdir -p build/ios-evidence
          container=$(xcrun simctl get_app_container "$IOS_SIMULATOR_ID" com.warrantycave.app data)
          cp "$container/Documents/ios-smoke.png" build/ios-evidence/warrantycave-ios.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warrantycave-ios-simulator-evidence
          path: build/ios-evidence/
          retention-days: 7
